[package]
name = "riker-ngs-derive"
version = "0.4.1"
authors = ["Tim Fennell <tim@fulcrumgenomics.com>"]
description = "Proc-macro support crate for riker-ngs"
repository = "https://github.com/fulcrumgenomics/riker"
homepage = "https://github.com/fulcrumgenomics/riker"
license = "MIT"
edition = "2024"
rust-version = "1.85.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# cargo-release: don't tag from this crate. The workspace `release.toml`
# sets `shared-version = true` + `tag-name = "v{{version}}"`, so the
# main `riker-ngs` crate creates a single `vX.Y.Z` tag for the release;
# without this override, cargo-release would also try to create the same
# tag from this crate and abort with "tag already exists".
[package.metadata.release]
tag = false
